name: Validate game scripts

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/third-person-camera-controls]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline game scripts
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.current = [] if not attrs.get("src") else None

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      if self.current is not None:
                          self.scripts.append("".join(self.current))
                      self.current = None

          parser = InlineScripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No inline JavaScript found in index.html")
          for i, script in enumerate(parser.scripts, 1):
              Path(f"/tmp/inline-{i}.js").write_text(script, encoding="utf-8")
              print(f"Extracted inline script {i}")
          PY
          for file in /tmp/inline-*.js; do node --check "$file"; done
      - name: Check minimap script
        run: node --check minimap.js
