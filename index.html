<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Mini City 3D — Alpha 0.1</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9dd8ee}canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 8px #10253c88}
.panel{background:#102033b8;border:1px solid #ffffff28;border-radius:14px;padding:12px 15px;backdrop-filter:blur(8px);box-shadow:0 8px 28px #10203320}
#brand{position:absolute;top:16px;left:16px;font-weight:900;letter-spacing:.04em;font-size:15px}
#brand small{display:block;font-weight:500;font-size:11px;opacity:.75;letter-spacing:.12em;margin-top:3px}
#stats{position:absolute;top:16px;right:16px;min-width:135px;text-align:right;font-variant-numeric:tabular-nums;pointer-events:auto}
#speed{font-size:30px;font-weight:900;line-height:1}#speed span{font-size:11px;font-weight:700;opacity:.75;margin-left:5px}
#help{position:absolute;left:16px;bottom:16px;font-size:12px;line-height:1.6;max-width:245px}
#toast{position:absolute;top:90px;left:50%;transform:translateX(-50%);font-weight:700;font-size:13px;white-space:nowrap}
#mobile{display:none;position:fixed;inset:auto 0 22px 0;padding:0 20px;justify-content:space-between;align-items:end;pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px;pointer-events:auto}
.control{border:1px solid #ffffff65;background:#10203399;color:white;border-radius:14px;font-size:20px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none;display:grid;place-items:center;box-shadow:0 4px 14px #10203330}
.control:active,.control.active{background:#ffbd4a;color:#152235}
#gas{width:62px;height:62px;border-radius:50%;font-size:14px;background:#1b8e68dd}
#brake{width:54px;height:54px;border-radius:50%;font-size:12px;background:#b84747dd}
#minimap-wrap{position:absolute;right:16px;top:112px;width:164px;padding:7px;border-radius:14px;background:#102033b8;border:1px solid #ffffff35;backdrop-filter:blur(8px);box-shadow:0 8px 28px #10203320}
#minimap-title{font-size:10px;font-weight:800;letter-spacing:.12em;opacity:.8;margin:0 0 5px 3px}
#missions{position:absolute;top:100px;left:16px;width:min(290px,calc(100vw - 32px));pointer-events:auto}
#missions h3{margin:0 0 8px;font-size:13px;letter-spacing:.04em}
#mission-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:9px}
.mission-choice{flex:1;border:1px solid #ffffff35;border-radius:9px;background:#ffffff12;color:#fff;padding:8px 5px;font-size:11px;font-weight:800;cursor:pointer}
.mission-choice.selected{background:#ffc04d;color:#172538;border-color:#ffe0a0}
#mission-start{width:100%;border:0;border-radius:9px;background:#1db783;color:#08271d;padding:9px;font-weight:900;cursor:pointer}
#mission-status{font-size:12px;line-height:1.55;margin-top:8px;white-space:pre-line}
#mission-meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;opacity:.85;margin-top:6px}
#mission-toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;text-align:center;background:#102033e8;border:1px solid #ffffff45;border-radius:18px;padding:18px 24px;display:none;max-width:calc(100vw - 36px)}
#garage-open{margin-top:7px;padding:6px 10px;border:1px solid #ffffff45;border-radius:8px;background:#ffffff14;color:#fff;font-weight:800;cursor:pointer}
#garage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100vw - 28px));pointer-events:auto;display:none;z-index:5}
#garage h3{margin:0 0 8px;font-size:16px}#garage p{font-size:12px;opacity:.8;margin:0 0 12px}
.garage-car{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;margin:7px 0;border:1px solid #ffffff30;border-radius:10px;background:#ffffff0b;color:#fff;width:100%;text-align:left;cursor:pointer}
.garage-car strong{display:block;font-size:13px}.garage-car small{display:block;font-size:11px;opacity:.75;margin-top:3px}
.garage-car:disabled{opacity:.55;cursor:default}.garage-car.active-car{border-color:#ffc04d;background:#ffc04d22}
#garage-close{width:100%;margin-top:6px;border:0;border-radius:9px;background:#ffffff20;color:white;padding:9px;font-weight:800;cursor:pointer}
#nav-arrow{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);font-size:36px;color:#7dffb0;text-shadow:0 0 14px #00ff8a,0 3px 8px #102033;display:none;line-height:1}
@media(max-width:700px){#missions{top:72px;left:12px;width:min(235px,calc(100vw - 140px));padding:9px 10px}#missions h3{font-size:11px}#mission-options{gap:4px;margin-bottom:6px}.mission-choice{padding:7px 2px;font-size:10px}#mission-start{padding:7px;font-size:11px}#mission-status{font-size:10px;margin-top:5px}#mission-meta{font-size:10px}}
#minimap{display:block;width:100%;aspect-ratio:1;border-radius:8px;background:#83b96a}
@media(max-width:700px){#minimap-wrap{top:104px;right:12px;width:112px;padding:5px}#minimap-title{font-size:9px;margin-bottom:3px}} 
@media(max-width:700px){#mobile{display:flex}#help{bottom:165px;font-size:11px;max-width:190px}#brand{top:12px;left:12px}#stats{top:12px;right:12px}#toast{top:78px;font-size:12px}}
</style>
</head>
<body>
<div id="hud">
  <div id="brand" class="panel">MINI CITY <small>3D DRIVE · ALPHA 0.1</small></div>
  <div id="stats" class="panel"><div id="speed">0<span>KM/H</span></div><div id="traffic-status" style="font-size:11px;opacity:.75;margin-top:6px">城市驾驶 · AI 交通加载中</div><div id="pickup-streak" style="font-size:11px;color:#ffd34f;margin-top:4px">🪙 金币连击：—</div><div id="nitro-wrap" style="margin-top:9px;text-align:left"><div style="display:flex;justify-content:space-between;font-size:10px;font-weight:800;margin-bottom:4px"><span>⚡ 氮气加速 SHIFT</span><span id="nitro-value">100%</span></div><div style="height:6px;background:#ffffff30;border-radius:99px;overflow:hidden"><div id="nitro-fill" style="height:100%;width:100%;background:linear-gradient(90deg,#38e8ff,#7b8cff);border-radius:99px;box-shadow:0 0 10px #38e8ff88"></div></div></div><button id="garage-open">🚘 车库</button></div>
  <div id="toast" class="panel">WASD / 方向键驾驶 · 手机使用屏幕按键</div>
  <div id="missions" class="panel">
    <h3>🏁 城市驾驶挑战</h3>
    <div id="mission-options">
      <button class="mission-choice selected" data-mission="0">新手赛</button>
      <button class="mission-choice" data-mission="1">街区赛</button>
      <button class="mission-choice" data-mission="2">极限赛</button>
      <button class="mission-choice" data-mission="3">金币寻宝</button>
    </div>
    <button id="mission-start">开始挑战</button>
    <div id="mission-status">选择难度，穿过城市里的发光检查点。</div>
    <div id="mission-meta"><span id="mission-progress">进度 0/0</span><span id="mission-reward">金币 0</span></div>
  </div>
  <div id="mission-toast"></div>
  <div id="nav-arrow">⬆</div>
  <div id="garage" class="panel">
    <h3>🚘 城市车库</h3>
    <p id="garage-balance">金币：0 · 解锁车辆并立即试驾</p>
    <button class="garage-car active-car" data-car="0"><span><strong>街头轿车</strong><small>免费 · 稳定操控 · 极速 122</small></span><b>已拥有</b></button>
    <button class="garage-car" data-car="1"><span><strong>烈焰跑车</strong><small>250 金币 · 加速更快 · 极速 155</small></span><b>解锁</b></button>
    <button class="garage-car" data-car="2"><span><strong>霓虹跑车</strong><small>500 金币 · 极速最高 · 灵活漂移</small></span><b>解锁</b></button>
    <button id="garage-close">返回驾驶</button>
  </div>
  <div id="minimap-wrap"><div id="minimap-title">CITY MAP · N</div><canvas id="minimap" width="220" height="220" aria-label="城市小地图"></canvas></div>
  <div id="help" class="panel">目标：自由驾驶并收集金币环，每个 +25 金币。<br>W / ↑ 加速　S / ↓ 刹车倒车<br>A / ← 左转　D / → 右转<br>空格手刹　Shift 氮气加速　R 重置车辆</div>
</div>
<div id="mobile">
  <div class="pad">
    <div></div><button class="control" data-key="ArrowUp">▲</button><div></div>
    <button class="control" data-key="ArrowLeft">◀</button><button class="control" data-key="ArrowDown">▼</button><button class="control" data-key="ArrowRight">▶</button>
  </div>
  <div style="display:flex;gap:9px;align-items:end;pointer-events:auto"><button class="control" id="brake" data-key="Space">刹车</button><button class="control" id="gas" data-key="KeyW">加速</button></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9dd8ee);
scene.fog = new THREE.Fog(0x9dd8ee, 90, 235);
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, .1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9f3ff, 0x62774e, 2.0));
const sun = new THREE.DirectionalLight(0xfff0d0, 2.3);
sun.position.set(-45,75,35); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.left=-100; sun.shadow.camera.right=100; sun.shadow.camera.top=100; sun.shadow.camera.bottom=-100;
scene.add(sun);

const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});
const grassMat=mat(0x7fc16c), roadMat=mat(0x424d5a), sidewalkMat=mat(0xd7d5c9), lineMat=mat(0xf4e7a0);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),grassMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);

function box(w,h,d,material,x,y,z, parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function road(x,z,w,d){box(w,.08,d,roadMat,x,0,z); if(w>d){for(let xx=x-w/2+3;xx<x+w/2;xx+=6)box(2,.012,.13,lineMat,xx,.05,z)}else{for(let zz=z-d/2+3;zz<z+d/2;zz+=6)box(.13,.012,2,lineMat,x,.05,zz)}}
road(0,0,240,13);road(0,0,13,240);
for(const p of [-60,60]){road(0,p,240,11);road(p,0,11,240)}
// blocks of colourful low-poly buildings
const buildingColors=[0xf3bd85,0xd98573,0x88b6c9,0xe6d69a,0xb1c4a0,0xb2a3c9,0xe8a8ad,0xd8d9df];
const windowMat=mat(0x9bd3e3,.55), roofMat=mat(0x586575);
const occupied=[];
function building(x,z,w,d,h,color){
 const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);
 const body=box(w,h,d,mat(color),0,h/2,0,group);
 box(w+.35,.25,d+.35,roofMat,0,h+.08,0,group);
 // front-facing rows of simple windows
 const cols=Math.max(2,Math.floor(w/2.4)), rows=Math.max(1,Math.floor(h/2.5));
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
   const wx=-w/2+(c+.5)*w/cols, wy=1.15+r*(h-1.6)/rows;
   box(.65,.72,.035,windowMat,wx,wy,d/2+.025,group);
   box(.035,.72,.035,mat(0xf1f0df),wx,wy,d/2+.05,group);
 }
 occupied.push({x,z,hw:w/2+.8,hd:d/2+.8});
}
for(let gx=-2;gx<=2;gx++)for(let gz=-2;gz<=2;gz++){
 if(gx===0||gz===0)continue;
 const cx=gx*40, cz=gz*40;
 const count=2;
 for(let i=0;i<count;i++){
  const x=cx+(i===0?-7:7), z=cz+(Math.random()-.5)*9;
  const w=8+Math.random()*4,d=8+Math.random()*5,h=7+Math.random()*20;
  building(x,z,w,d,h,buildingColors[Math.floor(Math.random()*buildingColors.length)]);
 }
}
// park near one corner
const park=box(25,.08,25,mat(0x91d47a),-91,.02,-91);
for(let i=0;i<18;i++){
 const x=-101+Math.random()*20,z=-101+Math.random()*20;
 const trunk=box(.7,2,.7,mat(0x8b5b3e),x,1,z);
 const crown=new THREE.Mesh(new THREE.ConeGeometry(2.3,5,6),mat([0x39845b,0x4d995e,0x65aa62][i%3]));crown.position.set(x,4,z);crown.castShadow=true;scene.add(crown);
}
// street lights along main roads
for(const axis of ['x','z'])for(let p=-100;p<=100;p+=20)for(const side of [-1,1]){
 const x=axis==='x'?p:side*9,z=axis==='z'?p:side*9;
 box(.16,3,.16,mat(0x475563),x,1.5,z);
 box(.9,.16,.35,mat(0xfff1b3),x+(axis==='x'?.3:0),3,z+(axis==='z'?.3:0));
}

// car group: local forward is negative Z
const car=new THREE.Group();scene.add(car);
const carPaint=mat(0xf5a623,.45), glass=mat(0x8ed4e8,.35), tireMat=mat(0xff202f,.28);
// Safe fallback body mesh: keep the vehicle visible while retaining a shaped silhouette.
const bodyGeometry=new THREE.BoxGeometry(1.95,.62,3.85,2,1,4);
const pos=bodyGeometry.attributes.position;
for(let i=0;i<pos.count;i++){
  const z=pos.getZ(i);
  const taper=Math.abs(z)>1.35?.88:1;
  pos.setX(i,pos.getX(i)*taper);
}
bodyGeometry.computeVertexNormals();
const carBody=new THREE.Mesh(bodyGeometry,carPaint);
carBody.position.set(0,.75,0);carBody.castShadow=true;carBody.receiveShadow=true;car.add(carBody);
// Taper the cabin toward the roof so it reads as a car greenhouse, not a cube.
const cabinGeometry=new THREE.BoxGeometry(1.55,.72,1.95,2,2,2);
const cabinPositions=cabinGeometry.attributes.position;
for(let i=0;i<cabinPositions.count;i++){
 const y=cabinPositions.getY(i), x=cabinPositions.getX(i), z=cabinPositions.getZ(i);
 const roofFactor=y>0?.78:1;
 cabinPositions.setX(i,x*roofFactor);
 cabinPositions.setZ(i,z*(y>0?.76:1));
}
cabinGeometry.computeVertexNormals();
const carCabin=new THREE.Mesh(cabinGeometry,glass);
carCabin.position.set(0,1.38,-.35);carCabin.castShadow=true;carCabin.receiveShadow=true;car.add(carCabin);
const carRoof=box(1.28,.12,.98,carPaint,0,1.78,-.32,car);
// Extra bodywork: sloped glass, hood, trunk, bumpers, lamps and door details.
const frontBumper=box(1.95,.18,.22,mat(0x303943),0,.48,-2.12,car);
const rearBumper=box(1.95,.18,.22,mat(0x303943),0,.48,2.12,car);
const hood=box(1.72,.16,1.12,carPaint,0,1.02,-1.28,car);
const trunk=box(1.68,.15,.62,carPaint,0,1.01,1.55,car);
const grille=box(.82,.25,.07,mat(0x171d24),0,.68,-2.235,car);
const frontLip=box(1.82,.09,.18,mat(0x242b33),0,.38,-2.16,car);
const rearDiffuser=box(1.35,.1,.16,mat(0x242b33),0,.37,2.15,car);
const headlights=[];
for(const x of [-.68,.68]){
 const lamp=box(.48,.16,.08,mat(0xfff4c4),x,.86,-2.13,car);
 lamp.rotation.y=x<0?-.08:.08; headlights.push(lamp);
 box(.42,.12,.07,mat(0xff493f),x,.82,2.13,car);
 // Door handles and side body accents.
 box(.25,.055,.055,mat(0x303943),x*1.48,1.02,.05,car);
 box(.045,.12,1.25,mat(0xd5dce2),x*1.01,.78,.2,car);
}
// Slanted windshield and rear glass create a recognizable car cabin profile.
const windshield=box(1.38,.055,.72,mat(0x8ed4e8,.28),0,1.42,-1.03,car);
windshield.rotation.x=-.48;
const rearGlass=box(1.3,.055,.62,mat(0x8ed4e8,.28),0,1.42,.48,car);
rearGlass.rotation.x=.48;
const sideWindows=[];
for(const x of [-.79,.79]){
 const frontWindow=box(.055,.38,.68,mat(0x8ed4e8,.28),x,1.42,-.45,car);
 const backWindow=box(.055,.34,.52,mat(0x8ed4e8,.28),x,1.4,.35,car);
 sideWindows.push(frontWindow,backWindow);
 box(.06,.48,.055,mat(0x303943),x,1.43,-.02,car);
}
// Side mirrors, A-pillars and lower side skirts add a more recognizable road-car profile.
const mirrorMat=mat(0x303943,.4),mirrorGlass=mat(0x9bdcf0,.25);
for(const side of [-1,1]){
 const mirrorStem=box(.075,.09,.25,mirrorMat,side*.86,1.34,-.72,car);
 mirrorStem.rotation.x=-.18;
 const mirror=box(.22,.16,.28,mirrorMat,side*.98,1.39,-.78,car);
 mirror.rotation.y=side*.08;
 box(.025,.095,.18,mirrorGlass,side*1.095,1.4,-.79,car);
 const pillarFront=box(.075,.48,.09,carPaint,side*.59,1.47,-.88,car);
 pillarFront.rotation.x=-.42;
 const pillarRear=box(.075,.40,.09,carPaint,side*.59,1.46,.22,car);
 pillarRear.rotation.x=.48;
 box(.12,.13,2.45,mat(0x303943),side*1.00,.48,.02,car);
 // Small front wheel-arch accent and a rear quarter-panel trim.
 box(.06,.12,.72,mat(0x303943),side*1.025,.55,-1.30,car);
 box(.06,.12,.62,mat(0x303943),side*1.025,.55,1.30,car);
}
// Sporty raised hood vents; these remain subtle on the base car.
for(const x of [-.34,.34])box(.12,.025,.48,mat(0x303943),x,1.11,-1.32,car);
box(.72,.15,.08,mat(0xffffff),-.65,.85,-2.07,car);box(.72,.15,.08,mat(0xffffff),.65,.85,-2.07,car);
box(.65,.18,.08,mat(0xe85a4f),-.65,.82,2.07,car);box(.65,.18,.08,mat(0xe85a4f),.65,.82,2.07,car);
// Final exterior details: LED signatures, grille slats, plates and twin exhaust tips.
const ledHeadlightMat=new THREE.MeshStandardMaterial({color:0xf7ffff,emissive:0x8fdfff,emissiveIntensity:.7,roughness:.22});
const ledTailMat=new THREE.MeshStandardMaterial({color:0xff293d,emissive:0x9d0618,emissiveIntensity:.55,roughness:.25});
const amberSignalMat=new THREE.MeshStandardMaterial({color:0xffa12b,emissive:0x7b3500,emissiveIntensity:.3,roughness:.3});
for(const side of [-1,1]){
 // Slim LED strips sit on the outer edge of each headlamp.
 box(.34,.035,.025,ledHeadlightMat,side*.68,.91,-2.185,car);
 box(.40,.045,.025,ledTailMat,side*.68,.91,2.185,car);
 box(.12,.045,.025,amberSignalMat,side*.91,.88,-2.17,car);
 // Front grille crossbars and lower air intakes.
 box(.58,.035,.025,mat(0x59636d,.5),0,.68,-2.28,car);
 box(.58,.035,.025,mat(0x59636d,.5),0,.59,-2.28,car);
 box(.32,.11,.025,mat(0x171d24),side*.61,.51,-2.205,car);
 // A restrained side marker and rear reflector.
 box(.055,.07,.035,amberSignalMat,side*1.015,.78,-.65,car);
 box(.16,.045,.025,ledTailMat,side*.94,.72,2.18,car);
}
// Small front emblem and front/rear license plates give the bumpers scale.
const emblemMat=new THREE.MeshStandardMaterial({color:0xe8edf2,metalness:.8,roughness:.25});
box(.13,.13,.035,emblemMat,0,.73,-2.285,car);
box(.62,.18,.035,mat(0xe8edf2,.4),0,.48,-2.245,car);
box(.62,.18,.035,mat(0xe8edf2,.4),0,.48,2.245,car);
box(.50,.035,.018,mat(0x252c35),0,.48,-2.27,car);
box(.50,.035,.018,mat(0x252c35),0,.48,2.27,car);
// Twin metal exhaust tips under the rear diffuser.
const exhaustMat=new THREE.MeshStandardMaterial({color:0x9ba5ae,metalness:.85,roughness:.24});
for(const side of [-1,1]){
 const exhaust=new THREE.Mesh(new THREE.CylinderGeometry(.095,.11,.20,12),exhaustMat);
 exhaust.rotation.x=Math.PI/2;exhaust.position.set(side*.57,.39,2.22);car.add(exhaust);
 const exhaustDark=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,.205,12),new THREE.MeshStandardMaterial({color:0x252c35,metalness:.35,roughness:.55}));
 exhaustDark.rotation.x=Math.PI/2;exhaustDark.position.set(side*.57,.39,2.23);car.add(exhaustDark);
}
// Subtle performance styling: hood scoop, pinstripes, ducktail wing and roof antenna.
const aeroDark=mat(0x252c35,.42),stripeMat=mat(0xe8edf2,.32);
box(.68,.10,.42,aeroDark,0,1.115,-1.28,car);
box(.48,.035,.26,mat(0x111820),0,1.17,-1.29,car);

// Traffic lights at the 3x3 road grid. Each junction alternates right-of-way
// between east-west (X) and north-south (Z) traffic, with a short yellow phase.
const trafficSignals=[];
const signalByJunction=new Map();
const signalRedMat=new THREE.MeshStandardMaterial({color:0xff3849,emissive:0xff1020,emissiveIntensity:1.5});
const signalYellowMat=new THREE.MeshStandardMaterial({color:0xffd34d,emissive:0xffa600,emissiveIntensity:.15});
const signalGreenMat=new THREE.MeshStandardMaterial({color:0x48ff9a,emissive:0x13a957,emissiveIntensity:.15});
function createTrafficSignals(){
 let n=0;
 for(const x of [-60,0,60])for(const z of [-60,0,60]){
  const poleX=x+7.2,poleZ=z-7.2;
  box(.16,3.8,.16,mat(0x3d4b56,.7),poleX,1.9,poleZ);
  box(.72,.92,.36,mat(0x202a34,.5),poleX,3.45,poleZ);
  const bulbs=[];
  for(let b=0;b<3;b++){
   const material=[signalRedMat,signalYellowMat,signalGreenMat][b].clone();
   const bulb=new THREE.Mesh(new THREE.SphereGeometry(.19,10,8),material);
   bulb.position.set(poleX,3.73-b*.28,poleZ+.205);scene.add(bulb);bulbs.push(bulb);
  }
  const sig={x,z,offset:n*1.37,axis:'x',color:'green',bulbs};n++;
  trafficSignals.push(sig);signalByJunction.set(x+','+z,sig);
 }
}
function updateTrafficSignals(now){
 const cycle=(now/1000)%14;
 for(const sig of trafficSignals){
  const phase=(cycle+sig.offset)%14;
  if(phase<6){sig.axis='x';sig.color='green'}
  else if(phase<7){sig.axis='x';sig.color='yellow'}
  else if(phase<13){sig.axis='z';sig.color='green'}
  else {sig.axis='z';sig.color='yellow'}
  const active=sig.color==='green'?2:sig.color==='yellow'?1:0;
  sig.bulbs.forEach((b,i)=>{
   const on=i===active;
   b.material.emissiveIntensity=on?(sig.color==='yellow'?.9:1.5):.08;
   b.material.color.setHex(on?(i===0?0xff3849:i===1?0xffd34d:0x48ff9a):0x343b42);
  });
 }
}
function signalAllows(ai,target,prev){
 // Only regulate actual grid intersections, not arbitrary route points.
 const sx=Math.round(target.x/60)*60,sz=Math.round(target.z/60)*60;
 if(Math.abs(target.x-sx)>.5||Math.abs(target.z-sz)>.5)return true;
 const sig=signalByJunction.get(sx+','+sz);if(!sig)return true;
 const axis=Math.abs(target.x-prev.x)>Math.abs(target.z-prev.z)?'x':'z';
 return sig.axis===axis&&sig.color==='green';
}
createTrafficSignals();

function updateTraffic(dt){
 for(let i=0;i<trafficCars.length;i++){
  const ai=trafficCars[i],g=ai.group,route=trafficRoutes[ai.route],target=route[ai.target];
  const dx=target.x-g.position.x,dz=target.z-g.position.z,dist=Math.hypot(dx,dz);
  const prev=route[(ai.target-1+route.length)%route.length];
  const signalGreen=signalAllows(ai,target,prev);
  if(dist<2.8&&signalGreen)ai.target=(ai.target+1)%route.length;
  let desired=ai.baseSpeed;
  // Red/yellow means brake before entering the junction and wait for green.
  const targetIsJunction=Math.abs(target.x/60-Math.round(target.x/60))<.01&&Math.abs(target.z/60-Math.round(target.z/60))<.01;
  if(targetIsJunction&&!signalGreen&&dist<13)desired=dist<5.2?0:Math.min(desired,ai.baseSpeed*THREE.MathUtils.clamp((dist-5.2)/7.8,0,1));
  // Soft following-distance control prevents AI cars from bunching up.
  for(let j=0;j<trafficCars.length;j++)if(i!==j){
   const other=trafficCars[j].group,ox=other.position.x-g.position.x,oz=other.position.z-g.position.z,d=Math.hypot(ox,oz);
   if(d<7.5&&d>.01){
    const forwardX=-Math.sin(g.rotation.y),forwardZ=-Math.cos(g.rotation.y);
    const ahead=ox*forwardX+oz*forwardZ;
    const lateral=Math.abs(ox*forwardZ-oz*forwardX);
    if(ahead>0&&lateral<3.2){
     // Stop rather than creep into the bumper when the queue is tight.
     const followSpeed=d<2.9?0:ai.baseSpeed*THREE.MathUtils.clamp((d-2.9)/4.6,0,1);
     desired=Math.min(desired,followSpeed);
    }
   }
  }
  // Yield to the player if a traffic car approaches the player's immediate path.
  const px=car.position.x-g.position.x,pz=car.position.z-g.position.z,pd=Math.hypot(px,pz);
  if(pd<8&&pd>.01){
   const fx=-Math.sin(g.rotation.y),fz=-Math.cos(g.rotation.y);
   const playerAhead=px*fx+pz*fz;
   const playerLateral=Math.abs(px*fz-pz*fx);
   if(playerAhead>0&&playerLateral<3.7){
    const playerClosing=Math.abs(speed)>2;
    desired=Math.min(desired,playerAhead<3.1&&playerClosing?0:ai.baseSpeed*.2);
   }
  }
  ai.speed=THREE.MathUtils.damp(ai.speed,desired,2.8,dt);
  const angle=Math.atan2(target.x-g.position.x,-(target.z-g.position.z));
  const diff=Math.atan2(Math.sin(angle-g.rotation.y),Math.cos(angle-g.rotation.y));
  g.rotation.y+=THREE.MathUtils.clamp(diff,-1.7*dt,1.7*dt);
  g.position.x-=Math.sin(g.rotation.y)*ai.speed*dt;
  g.position.z-=Math.cos(g.rotation.y)*ai.speed*dt;
 }
 // Final low-cost spacing pass prevents cars from visibly occupying the same space.
 for(let i=0;i<trafficCars.length;i++)for(let j=i+1;j<trafficCars.length;j++){
  const a=trafficCars[i].group,b=trafficCars[j].group;
  const dx=b.position.x-a.position.x,dz=b.position.z-a.position.z,d=Math.hypot(dx,dz);
  if(d>0&&d<2.35){
   const push=(2.35-d)*.5, nx=dx/d,nz=dz/d;
   a.position.x-=nx*push;a.position.z-=nz*push;
   b.position.x+=nx*push;b.position.z+=nz*push;
   trafficCars[i].speed=Math.min(trafficCars[i].speed,1.2);
   trafficCars[j].speed=Math.min(trafficCars[j].speed,1.2);
  }
 }
}
buildCityTraffic();

let lastTrafficImpact=0;
function update(dt, now){
 // Keep signal phases live; without this call the lamps and right-of-way would freeze.
 updateTrafficSignals(now);
 if(now-lastPickupTime>12000&&pickupStreak>0){pickupStreak=0;pickupStreakEl.textContent='🪙 金币连击：—'}
 const forward=keys.has('KeyW')||keys.has('ArrowUp');
 const reverse=keys.has('KeyS')||keys.has('ArrowDown');
 const left=keys.has('KeyA')||keys.has('ArrowLeft');
 const right=keys.has('KeyD')||keys.has('ArrowRight');
 const handbrake=keys.has('Space');
 // Rear LED lamps brighten while reversing or using the handbrake.
 ledTailMat.emissiveIntensity=(reverse||handbrake)?1.8:.55;
 const steerInput=(left?1:0)-(right?1:0);
  const boostRequested=keys.has('ShiftLeft')||keys.has('ShiftRight');
  const boostActive=boostRequested&&nitro>0.5&&!reverse;
  if(boostActive)nitro=Math.max(0,nitro-34*dt);else nitro=Math.min(100,nitro+13*dt);
  const nitroFill=document.getElementById('nitro-fill');
  const nitroValue=document.getElementById('nitro-value');
  nitroFill.style.width=nitro.toFixed(1)+'%';nitroValue.textContent=Math.round(nitro)+'%';
  nitroFill.style.background=boostActive?'linear-gradient(90deg,#fff16a,#ff8b36)':'linear-gradient(90deg,#38e8ff,#7b8cff)';
  if(forward)speed+=vehicleStats[selectedVehicle].acceleration*(boostActive?1.85:1)*dt;
  else if(reverse)speed-=19*dt;
  else speed*=Math.pow(handbrake?.985:.992,dt*60);
  if(handbrake)speed*=Math.pow(.965,dt*60);
  speed=THREE.MathUtils.clamp(speed,-8,vehicleStats[selectedVehicle].maxSpeed*(boostActive?1.38:1));
  steering=THREE.MathUtils.damp(steering,steerInput,14,dt);
  const speedAbs=Math.abs(speed);
  const speedFactor=THREE.MathUtils.clamp(speedAbs/4,0,1);
  // Responsive yaw, with a stronger pivot when the handbrake is held.
  const yawRate=THREE.MathUtils.clamp(.85+speedAbs*.038,.85,2.15);
  if(speedAbs>.18)car.rotation.y+=steering*yawRate*dt*Math.sign(speed)*(handbrake?1.42:1);
  // Lateral velocity creates a controllable slip angle instead of movement glued to the nose.
  const driftGrip=handbrake?0.72:vehicleStats[selectedVehicle].grip;
  const lateralPush=steering*speedAbs*(handbrake?1.55:.22)*speedFactor;
  lateralSpeed+=lateralPush*dt;
  lateralSpeed*=Math.exp(-driftGrip*dt);
  lateralSpeed=THREE.MathUtils.clamp(lateralSpeed,-12,12);
  // Body roll adds weight and inertia during fast corners.
  const targetRoll=-steering*THREE.MathUtils.clamp(speedAbs/22,0,1)*(handbrake?.16:.075);
  car.rotation.z=THREE.MathUtils.damp(car.rotation.z,targetRoll,5,dt);
  // Front wheels visually follow steering input; keep the rear wheels aligned.
 wheels.forEach((w,i)=>{w.rotation.y=(i===0||i===2)?steering*.28:0;});
 const oldX=car.position.x,oldZ=car.position.z;
  car.position.x+=(-Math.sin(car.rotation.y)*speed+Math.cos(car.rotation.y)*lateralSpeed)*dt;
  car.position.z+=(-Math.cos(car.rotation.y)*speed-Math.sin(car.rotation.y)*lateralSpeed)*dt;
  if(collides(car.position.x,car.position.z)){car.position.x=oldX;car.position.z=oldZ;speed*=-.22;lateralSpeed*=-.25}
 car.position.x=THREE.MathUtils.clamp(car.position.x,-119,119);car.position.z=THREE.MathUtils.clamp(car.position.z,-119,119);
 updateTraffic(dt,now);
 // Player/traffic contact: stop the player's car at impact, damp the AI car, and notify once per cooldown.
 for(const ai of trafficCars){
  const dx=car.position.x-ai.group.position.x,dz=car.position.z-ai.group.position.z,d=Math.hypot(dx,dz);
  if(d<2.35){
   car.position.x=oldX;car.position.z=oldZ;
   speed*=-.28;lateralSpeed*=-.2;
   ai.speed=Math.min(ai.speed,1.0);
   if(now-lastTrafficImpact>1250){
    showMissionToast('🚧 车辆碰撞！注意与车流保持距离');
    lastTrafficImpact=now;
   }
   break;
  }
 }
 if(missionRunning&&activeMission){
  const navTarget=activeMission.points[checkpointIndex];
  const navAngle=Math.atan2(navTarget.x-car.position.x,-(navTarget.z-car.position.z))+car.rotation.y;
  navArrow.style.display='block';navArrow.style.transform=`translateX(-50%) rotate(${navAngle}rad)`;
  missionTimeLeft-=dt;
  if(missionTimeLeft<=0){finishMission(false)}
  else {
   const target=activeMission.points[checkpointIndex];
   if(Math.hypot(car.position.x-target.x,car.position.z-target.z)<5.2){
    checkpointIndex++;
    if(checkpointIndex>=activeMission.points.length){finishMission(true)}
    else {buildMissionMarkers();showMissionToast(`检查点 ${checkpointIndex}/${activeMission.points.length}`)}
   }
   if(missionRunning)refreshMissionPanel();
  }
 }
 wheels.forEach(w=>w.rotation.x+=speed*dt*1.5);
 // Tokens are a repeatable exploration goal; collection is saved across reloads.
 for(let i=pickupMeshes.length-1;i>=0;i--){
  const token=pickupMeshes[i];
  token.rotation.y+=dt*1.8;
  token.position.y=1.15+Math.sin(now*.003+i)*.13;
  if(Math.hypot(car.position.x-token.position.x,car.position.z-token.position.z)<2.35){
   const id=token.userData.pickupId;
   collectedPickups.add(id);
   if(now-lastPickupTime<=12000)pickupStreak++;else pickupStreak=1;
   lastPickupTime=now;
   const bonus=Math.min(25,Math.max(0,pickupStreak-1)*5);
   const reward=25+bonus;coins+=reward;
   scene.remove(token);pickupMeshes.splice(i,1);
   saveProgress();applyVehicle();
   pickupStreakEl.textContent=pickupStreak>1?'🪙 金币连击：'+pickupStreak+' · 本次 +'+reward:'🪙 金币连击：1';
   showMissionToast(pickupStreak>1?'✨ 连续收集 '+pickupStreak+' 次！ +'+reward+' 金币':'✨ 收集成功！ +25 金币');
  }
 }
 // Driving feedback: the chase camera pulls back slightly at speed and FOV opens under acceleration.
 const speedRatio=THREE.MathUtils.clamp(Math.abs(speed)/vehicleStats[selectedVehicle].maxSpeed,0,1);
 const desiredFov=62+speedRatio*8+(handbrake?2:0);
 camera.fov=THREE.MathUtils.damp(camera.fov,desiredFov,3.5,dt);
 camera.updateProjectionMatrix();
 cameraTarget.set(car.position.x+Math.sin(car.rotation.y)*(9+speedRatio*2.2),4.8+speedRatio*.45,car.position.z+Math.cos(car.rotation.y)*(9+speedRatio*2.2));
 camera.position.lerp(cameraTarget,1-Math.exp(-5.5*dt));
 const look=new THREE.Vector3(car.position.x-Math.sin(car.rotation.y)*5,1.2,car.position.z-Math.cos(car.rotation.y)*5);
 camera.lookAt(look);
 speedEl.innerHTML=Math.round(Math.abs(speed)*3.6)+'<span>KM/H</span>';
}
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;update(dt,now);renderer.render(scene,camera)}
// initial camera position behind car
camera.position.set(0,5,18);camera.lookAt(0,1,0);
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});
</script>
